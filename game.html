<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Luvi's Birthday Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1230; --shell:#ff9ac4; --shell-d:#e06a9f; --shell-l:#ffc7df; --shell-dd:#b84a7d;
  --bezel:#2a2140; --ink:#fff1e8; --navy:#1d2b53; --pink:#ff77a8; --plum:#7e2553; --yellow:#ffec27;
  --px:'Press Start 2P',ui-monospace,'Courier New',monospace;
  --vt:'VT323',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--vt);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.6px);background-size:24px 24px}
.hide{display:none!important}

/* ---------- the pink handheld ---------- */
#device{position:relative;width:min(calc(100vw - 16px),920px);display:grid;grid-template-columns:1fr 1fr;
  grid-template-areas:"bezel bezel" "dpad ab" "ss ss";gap:12px 8px;padding:12px 12px 16px;background:var(--shell);
  border-radius:16px 16px 48px 16px;
  box-shadow:inset -5px -6px 0 var(--shell-d),inset 5px 5px 0 var(--shell-l),0 10px 0 var(--shell-dd),0 24px 40px rgba(0,0,0,.45)}
#device.land{grid-template-columns:150px 1fr 150px;grid-template-areas:"dpad bezel ab" ". ss .";border-radius:46px;
  padding:16px 18px 12px;gap:10px 14px;align-items:center}
#bezel{grid-area:bezel;background:var(--bezel);padding:8px 12px 7px;border-radius:10px 10px 30px 10px;box-shadow:inset 0 0 0 2px #17121f}
#device.land #bezel{border-radius:14px}
.bezel-top{display:flex;align-items:center;gap:6px;font-family:var(--px);font-size:6px;color:#8f86a8;margin:0 0 6px 2px;letter-spacing:.5px}
.led{width:7px;height:7px;border-radius:50%;background:#ff3b6b;box-shadow:0 0 6px #ff3b6b}
#screen{position:relative;width:100%;aspect-ratio:4/3;background:#0e0b16;overflow:hidden;container-type:inline-size}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.brand{font-family:var(--px);font-size:10px;color:#cfc6e6;text-align:center;margin-top:7px;letter-spacing:1px}
.brand b{color:var(--pink);font-weight:400}
.brand i{font-style:normal;color:#8f86a8;font-size:6px;margin-left:6px}

#dpad{grid-area:dpad;position:relative;width:120px;height:120px;justify-self:center}
#dpad button,#dpad .mid{position:absolute;width:40px;height:40px;background:#2b2440;border:none;color:#5c5378;
  font-size:13px;cursor:pointer;padding:0}
#dpad button{box-shadow:inset 0 -4px 0 #17121f}
#dpad .up{left:40px;top:0;border-radius:6px 6px 0 0}
#dpad .down{left:40px;bottom:0;border-radius:0 0 6px 6px}
#dpad .left{left:0;top:40px;border-radius:6px 0 0 6px}
#dpad .right{right:0;top:40px;border-radius:0 6px 6px 0}
#dpad .mid{left:40px;top:40px}
#dpad button.on{background:#3d3459;box-shadow:inset 0 -1px 0 #17121f}
#ab{grid-area:ab;position:relative;width:128px;height:100px;justify-self:center}
.rbtn{position:absolute;width:54px;height:54px;border-radius:50%;border:none;font-family:var(--px);font-size:13px;
  color:#ffe3ef;cursor:pointer;background:var(--plum);box-shadow:inset 0 -5px 0 #4e1535,0 3px 0 rgba(0,0,0,.25)}
.rbtn.a{right:0;top:0}
.rbtn.b{left:0;bottom:0}
.rbtn.on{box-shadow:inset 0 -1px 0 #4e1535;transform:translateY(3px)}
#ss{grid-area:ss;display:flex;justify-content:center;gap:28px}
.pill{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--px);font-size:7px;color:#9b4a73;
  background:none;border:none;cursor:pointer;padding:0}
.pill span{display:block;width:44px;height:12px;border-radius:8px;background:#8a6a85;box-shadow:inset 0 -3px 0 #5d4559;transform:rotate(-20deg)}
.pill.on span{box-shadow:none;transform:rotate(-20deg) translateY(2px)}
button:focus-visible{outline:3px solid #29adff;outline-offset:3px}
/* ---- mode HP (konsol berdiri): HUD di atas layar, dialog di panel bawah layar, tombol lebih gede ---- */
#hudSlot,#panel{display:none}
#device:not(.land) #hudSlot{display:block;min-height:24px;margin:0 0 7px;container-type:inline-size}
#device:not(.land) #hudSlot #hud{position:static;padding:0;font-size:clamp(7px,2.5cqw,11px)}
#device:not(.land) #panel{display:block;position:relative;height:150px;margin-top:12px;container-type:inline-size}
#device.compact #panel{height:124px;margin-top:10px}
#panelHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;
  font-family:var(--px);font-size:8px;line-height:1.8;color:#6f6690}
#panel #dialog{position:absolute;left:9px;right:9px;top:9px;bottom:9px;min-height:0;font-size:clamp(16px,5.8cqw,26px);padding:12px 14px 14px}
#panel #dlgName{left:8px;top:-9px}
#panel #menu{position:absolute;right:9px;top:9px;bottom:9px;width:52%;min-height:0;font-size:clamp(8px,2.9cqw,12px);gap:16px 6px;padding:12px 10px}
#panel #dialog.withmenu{padding-right:56%}
#device:not(.land):not(.compact) #dpad{width:156px;height:156px}
#device:not(.land):not(.compact) #dpad button,#device:not(.land):not(.compact) #dpad .mid{width:52px;height:52px;font-size:15px}
#device:not(.land):not(.compact) #dpad .up,#device:not(.land):not(.compact) #dpad .down,#device:not(.land):not(.compact) #dpad .mid{left:52px}
#device:not(.land):not(.compact) #dpad .left,#device:not(.land):not(.compact) #dpad .right,#device:not(.land):not(.compact) #dpad .mid{top:52px}
#device:not(.land):not(.compact) #ab{width:160px;height:126px}
#device:not(.land):not(.compact) .rbtn{width:68px;height:68px;font-size:16px}
#device:not(.land):not(.compact) .pill span{width:52px;height:14px}
#kb{font-family:var(--px);font-size:8px;color:#8f86a8;text-align:center;line-height:1.7;padding:0 8px}

/* ---------- on-screen UI ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:2.4cqw 2.6cqw;pointer-events:none;font-family:var(--px);font-size:clamp(5px,1.8cqw,10px);z-index:4;white-space:nowrap}
.chip{background:rgba(29,43,83,.88);color:#fff1e8;padding:1.4cqw 1.8cqw;line-height:1.4;
  box-shadow:0 0 0 2px #fff1e8,0 0 0 4px rgba(29,43,83,.88)}
#hudGoal{text-align:right}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:8cqw;
  text-align:center;pointer-events:none;font-family:var(--px);z-index:3}
#title .t1{font-size:3.6cqw;color:#fff1e8;text-shadow:.5cqw .5cqw 0 #7e2553}
#title .t2{font-size:7.2cqw;line-height:1.3;color:#ffec27;margin-top:2cqw;text-shadow:.7cqw .7cqw 0 #7e2553,-.35cqw -.35cqw 0 #ff77a8}
#title .t3{font-size:2.5cqw;color:#fff1e8;margin-top:3cqw;text-shadow:.4cqw .4cqw 0 #7e2553}
#title .press{position:absolute;bottom:6cqw;font-size:2.8cqw;color:#fff1e8;text-shadow:.4cqw .4cqw 0 #1d2b53;animation:blink 1s steps(2) infinite}
#title.rainbow .t2{animation:rb 1.2s steps(4) infinite}
@keyframes rb{0%{color:#ffec27}25%{color:#ff77a8}50%{color:#29adff}75%{color:#00e436}}
@keyframes blink{50%{opacity:0}}
#dialog{position:absolute;left:max(3.5%,10px);right:max(3.5%,10px);bottom:max(3.5%,10px);min-height:30%;padding:2.4cqw 3.4cqw 3.4cqw;background:#fff1e8;
  color:#1d2b53;font-family:var(--vt);font-size:clamp(14px,5.6cqw,30px);line-height:1.05;white-space:pre-wrap;z-index:5;
  box-shadow:0 0 0 3px #1d2b53,0 0 0 6px #fff1e8,0 0 0 9px #1d2b53}
#dlgName{position:absolute;left:2cqw;top:-9px;transform:translateY(-100%);background:var(--pink);color:#fff;
  font-family:var(--px);font-size:clamp(6px,2.2cqw,11px);padding:1.4cqw 2cqw;box-shadow:0 0 0 3px #1d2b53}
#dialog.withmenu{padding-right:56%}
#dlgNext{position:absolute;right:2.4cqw;bottom:1.2cqw;font-size:.8em;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#menu{position:absolute;right:max(3.5%,10px);bottom:max(3.5%,10px);width:50%;min-height:30%;padding:3cqw 2.6cqw;background:#fff1e8;color:#1d2b53;
  font-family:var(--px);font-size:clamp(6px,2.3cqw,12px);display:grid;grid-template-columns:1fr 1fr;align-content:center;gap:3.4cqw 1cqw;z-index:6;
  box-shadow:0 0 0 3px #1d2b53,0 0 0 6px #fff1e8,0 0 0 9px #1d2b53}
#menu div{position:relative;padding-left:3.2cqw;cursor:pointer;line-height:1.4}
#menu div.sel::before{content:'▶';position:absolute;left:0}
.hpbox{position:absolute;background:#fff1e8;color:#1d2b53;font-family:var(--px);font-size:clamp(6px,2.2cqw,11px);
  padding:1.8cqw 2.4cqw;min-width:44%;z-index:4;box-shadow:0 0 0 2px #1d2b53,.8cqw .8cqw 0 2px rgba(29,43,83,.35)}
#ebox{left:3%;top:4%}
#pbox{right:3%;top:40%}
.hpbox .lv{float:right}
.hprow{display:flex;align-items:center;gap:1.4cqw;margin-top:1.6cqw;clear:both}
.hprow small{font-size:.8em;color:#d9508a}
.bar{flex:1;height:1.9cqw;min-height:5px;background:#5f574f;box-shadow:0 0 0 1px #1d2b53;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#00e436;transition:width .7s steps(10)}
.bar i.mid{background:#ffa300}
.bar i.low{background:#ff004d}
.hpnum{text-align:right;margin-top:1.2cqw}
#fade{position:absolute;inset:0;background:#0e0b16;opacity:0;pointer-events:none;z-index:20}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:19}
#flash.go{animation:fl .5s steps(4)}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}

/* ---------- full-screen layer: cards, letter, bag, credits ---------- */
#layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(14,10,24,.8);overflow:hidden}
.card{position:relative;width:min(84vw,320px);background:#fff1e8;color:#1d2b53;padding:12px 12px 10px;--rc:#c2c3c7;
  box-shadow:0 0 0 4px #1d2b53,0 0 0 8px var(--rc),0 0 0 12px #1d2b53,0 18px 30px rgba(0,0,0,.6);animation:cardIn .5s steps(6)}
@keyframes cardIn{from{transform:translateY(50px) scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.card .rarity{font-family:var(--px);font-size:10px;background:var(--rc);color:#1d2b53;padding:7px 8px;text-align:center;
  margin:-12px -12px 10px;letter-spacing:1px}
.card .ph{position:relative;width:100%;aspect-ratio:4/5;max-height:46vh;background:#ffd6e7;overflow:hidden;box-shadow:0 0 0 3px #1d2b53}
.card .ph canvas{width:100%;height:100%;display:block;object-fit:cover}
.card .ttl{font-family:var(--px);font-size:9px;line-height:1.6;margin:12px 2px 5px}
.card .txt{font-family:var(--vt);font-size:19px;line-height:1.05;margin:0 2px}
.card .hint,.letter .hint,.bag .hint{font-family:var(--px);font-size:7px;color:#83769c;text-align:right;margin-top:9px;animation:blink 1s steps(2) infinite}
.card .new{position:absolute;right:-16px;top:-16px;z-index:2;font-family:var(--px);font-size:9px;background:#ff004d;color:#fff;
  padding:6px 7px;transform:rotate(12deg);box-shadow:0 0 0 3px #1d2b53}
.card.legendary{animation:cardIn .5s steps(6),rainbow 1.6s steps(3) infinite}
@keyframes rainbow{
  0%{box-shadow:0 0 0 4px #1d2b53,0 0 0 8px #ffd23f,0 0 0 12px #1d2b53,0 0 40px 14px rgba(255,210,63,.55)}
  33%{box-shadow:0 0 0 4px #1d2b53,0 0 0 8px #ff77a8,0 0 0 12px #1d2b53,0 0 40px 14px rgba(255,119,168,.55)}
  66%{box-shadow:0 0 0 4px #1d2b53,0 0 0 8px #29adff,0 0 0 12px #1d2b53,0 0 40px 14px rgba(41,173,255,.55)}
  100%{box-shadow:0 0 0 4px #1d2b53,0 0 0 8px #ffd23f,0 0 0 12px #1d2b53,0 0 40px 14px rgba(255,210,63,.55)}}
.card.legendary .ph::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 48%,transparent 60%);transform:translateX(-130%);animation:shine 2.6s 1.4s infinite}
@keyframes shine{to{transform:translateX(130%)}}
.spark{position:absolute;font-family:var(--px);color:#ffec27;font-size:14px;text-shadow:2px 2px 0 #7e2553;animation:blink .8s steps(2) infinite;pointer-events:none}
.letter{width:min(92vw,540px);max-height:94%;overflow:auto;background:#fff1e8;color:#1d2b53;padding:18px 20px 14px;
  box-shadow:0 0 0 4px #1d2b53,0 0 0 8px #ff77a8,0 0 0 12px #1d2b53;animation:cardIn .5s steps(6)}
.letter h3{font-family:var(--px);font-size:10px;margin:0 0 12px;color:#d9508a;line-height:1.5}
.letter .body{font-family:var(--vt);font-size:23px;line-height:1.1;white-space:pre-wrap;min-height:120px}
.letter .sign{font-family:var(--px);font-size:9px;text-align:right;margin-top:14px;color:#7e2553;line-height:1.6}
.bag{width:min(92vw,440px);background:#fff1e8;color:#1d2b53;padding:16px;font-family:var(--px);font-size:9px;
  box-shadow:0 0 0 4px #1d2b53,0 0 0 8px #ff77a8,0 0 0 12px #1d2b53;animation:cardIn .4s steps(5)}
.bag h3{font-size:11px;margin:0 0 10px;color:#d9508a}
.bag .row{display:flex;align-items:center;gap:10px;margin:8px 0;font-family:var(--vt);font-size:21px}
.bag .row canvas{width:32px;height:32px;image-rendering:pixelated}
.bag .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.bag .mini{aspect-ratio:4/5;background:#ffd6e7 center/cover no-repeat;cursor:pointer;box-shadow:0 0 0 2px #1d2b53,0 0 0 4px var(--rc)}
.bag .mini.empty{background:#d8cfc8;display:flex;align-items:center;justify-content:center;font-size:13px;color:#83769c;cursor:default}
.credits{position:absolute;inset:0;overflow:hidden;text-align:center;font-family:var(--px);color:#fff1e8}
.credits .roll{position:absolute;left:0;right:0;top:100%;padding:0 16px;animation:roll var(--dur,26s) linear forwards}
@keyframes roll{to{transform:translateY(calc(-100% - 100vh))}}
.credits h4{font-size:9px;color:#ff77a8;margin:26px 0 8px;font-weight:400}
.credits p{font-size:12px;margin:0 0 4px;line-height:1.6}
.credits .big{font-size:clamp(14px,4vw,22px);color:#ffec27;line-height:1.5;margin-top:30px}
.credits .end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.credits .end .big{margin:0;animation:rb 1.2s steps(4) infinite}
.credits .end small{font-size:9px;animation:blink 1s steps(2) infinite}
</style>
</head>
<body>
<div id="device">
  <div id="bezel">
    <div class="bezel-top"><span class="led"></span>BATTERY · HAPPY</div>
    <div id="hudSlot"></div>
    <div id="screen">
      <canvas id="cv" width="256" height="192"></canvas>
      <div id="hud" class="hide"><span class="chip" id="hudCoin"></span><span class="chip" id="hudGoal"></span></div>
      <div id="title" class="hide"><div class="t1"></div><div class="t2"></div><div class="t3"></div><div class="press"></div></div>
      <div id="ebox" class="hpbox hide"><span>KUE RAKSASA</span><span class="lv">Lv99</span>
        <div class="hprow"><small>HP</small><div class="bar"><i id="ehp"></i></div></div></div>
      <div id="pbox" class="hpbox hide"><span id="pname">LUVI</span><span class="lv" id="plv">Lv19</span>
        <div class="hprow"><small>HP</small><div class="bar"><i id="php"></i></div></div><div class="hpnum" id="phpnum">100/100</div></div>
      <div id="dialog" class="hide"><div id="dlgName" class="hide"></div><div id="dlgText"></div><div id="dlgNext" class="hide">▼</div></div>
      <div id="menu" class="hide"></div>
      <div id="flash"></div>
      <div id="fade"></div>
    </div>
    <div id="panel"><div id="panelHint">◀▲▼▶ GERAK · A: NGOBROL / PILIH · START: TAS</div></div>
    <div class="brand" id="brand"><b>LUVI</b> GIRL<i>EDISI 20</i></div>
  </div>
  <div id="dpad">
    <button class="up" data-k="up" aria-label="Atas">▲</button>
    <button class="left" data-k="left" aria-label="Kiri">◀</button>
    <div class="mid"></div>
    <button class="right" data-k="right" aria-label="Kanan">▶</button>
    <button class="down" data-k="down" aria-label="Bawah">▼</button>
  </div>
  <div id="ab">
    <button class="rbtn b" data-k="b" aria-label="Tombol B">B</button>
    <button class="rbtn a" data-k="a" aria-label="Tombol A">A</button>
  </div>
  <div id="ss">
    <button class="pill" data-k="select" aria-label="Suara"><span></span><em id="sndLbl" style="font-style:normal">SUARA</em></button>
    <button class="pill" data-k="start" aria-label="Start / Tas"><span></span>START</button>
  </div>
</div>
<div id="kb">PANAH/WASD: gerak · Z/SPASI: A · X: B · ENTER: START (tas) · M: suara</div>
<div id="layer" class="hide"></div>

ctx.imageSmoothingEnabled = false;

const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
const DIRV = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]};

// =====================================================================
// PIXEL SPRITES (run-length: "3k" = kkk, "." = transparan)
// =====================================================================
const PAL = {k:'#1b1424',K:'#4a3a63',s:'#ffccaa',S:'#e9a585',e:'#1b1424',c:'#ff9ab8',b:'#a33a5e',p:'#ff77a8',P:'#d9508a',
  w:'#fff1e8',W:'#d8cfc8',y:'#ffec27',Y:'#e5b20b',o:'#ffa300',n:'#9b5a35',N:'#5e3523',l:'#c3a6ff',u:'#29adff',U:'#1d2b53',
  d:'#5f574f',L:'#c2c3c7',r:'#ff004d',g:'#43c85a',G:'#2b8a3e'};

function pixelReveal(canvas, src, dur) {
  const g = canvas.getContext('2d'), cw = canvas.width, ch = canvas.height;
  const img = new Image(), tmp = document.createElement('canvas'), tg = tmp.getContext('2d');
  const steps = [48, 32, 24, 16, 12, 8, 6, 4, 3, 2, 1];
  img.onload = () => {
    let t0 = null;
    const frame = ts => {
      if (!canvas.isConnected) return;
      if (t0 === null) t0 = ts;
      const p = Math.min(1, (ts - t0) / dur);
      const block = steps[Math.min(steps.length - 1, Math.floor(p * steps.length))];
      const s = Math.max(cw / img.width, ch / img.height), dw = img.width * s, dh = img.height * s, dx = (cw - dw) / 2, dy = (ch - dh) / 2;
      g.clearRect(0, 0, cw, ch);
      if (block <= 1) { g.imageSmoothingEnabled = true; g.drawImage(img, dx, dy, dw, dh); return; }
      const sw = Math.ceil(cw / block), sh = Math.ceil(ch / block);
      tmp.width = sw; tmp.height = sh; tg.imageSmoothingEnabled = true;
      tg.drawImage(img, dx / block, dy / block, dw / block, dh / block);
      g.imageSmoothingEnabled = false; g.drawImage(tmp, 0, 0, sw, sh, 0, 0, sw * block, sh * block);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  };
  img.src = src;
}

function setBar(el, pct) { el.style.width = Math.max(0, pct) + '%'; el.className = pct > 50 ? '' : pct > 20 ? 'mid' : 'low'; }
function drawCake(g, cx, by, s) {
  const bw = 64, bh = 22, tw = 44, th = 16, bx = cx - bw / 2, bt = by - bh, tx = cx - tw / 2, tt = bt - th;
  R(g, '#2a1b3d', cx - 39, by - 1, 78, 5); R(g, '#c2c3c7', cx - 38, by - 1, 76, 3); R(g, '#83769c', cx - 38, by + 2, 76, 1);
  R(g, '#2a1b3d', bx - 1, bt - 1, bw + 2, bh + 1); R(g, '#ff77a8', bx, bt, bw, bh); R(g, '#d9508a', bx + bw - 6, bt, 6, bh);
  R(g, '#fff1e8', bx, bt, bw, 4); for (let x = 0; x < bw; x += 6) R(g, '#fff1e8', bx + x + 1, bt + 4, 4, 1 + ((x * 7) % 5));
  R(g, '#2a1b3d', tx - 1, tt - 1, tw + 2, th + 1); R(g, '#fff1e8', tx, tt, tw, th); R(g, '#ead7cc', tx + tw - 5, tt, 5, th);
  R(g, '#ff77a8', tx, tt, tw, 4); for (let x = 0; x < tw; x += 5) R(g, '#ff77a8', tx + x + 1, tt + 4, 3, 1 + ((x * 3) % 4));
  for (let i = 0; i < 10; i++) R(g, ['#ffec27', '#29adff', '#00e436', '#ff004d'][i % 4], tx + 3 + Math.floor(hash(i, 4) * (tw - 8)), tt + 9 + Math.floor(hash(4, i) * 5), 2, 1);
  const fy = bt + 9;
  if (s.face === 'angry') {
    R(g, '#1d2b53', cx - 17, fy, 5, 5); R(g, '#1d2b53', cx + 12, fy, 5, 5); R(g, '#fff1e8', cx - 16, fy + 1, 1, 1); R(g, '#fff1e8', cx + 13, fy + 1, 1, 1);
    for (let i = 0; i < 6; i++) { R(g, '#1d2b53', cx - 20 + i, fy - 4 + Math.floor(i / 2), 1, 1); R(g, '#1d2b53', cx + 19 - i, fy - 4 + Math.floor(i / 2), 1, 1); }
    R(g, '#1d2b53', cx - 7, fy + 8, 14, 3); R(g, '#fff1e8', cx - 5, fy + 8, 2, 1); R(g, '#fff1e8', cx + 3, fy + 8, 2, 1);
  } else {
    for (let i = 0; i < 5; i++) { const yy = fy + 2 - (i === 2 ? 1 : i === 1 || i === 3 ? 0 : -1); R(g, '#1d2b53', cx - 17 + i, yy, 1, 1); R(g, '#1d2b53', cx + 12 + i, yy, 1, 1); }
    for (let i = 0; i < 10; i++) R(g, '#1d2b53', cx - 5 + i, fy + 8 + (i === 0 || i === 9 ? -1 : 0), 1, 1);
    R(g, '#ff9ab8', cx - 22, fy + 5, 4, 2); R(g, '#ff9ab8', cx + 18, fy + 5, 4, 2);
  }
  const n = s.candles.length, start = cx - (n - 1) * 8;
  s.candles.forEach((c, i) => {
    const x = start + i * 16, dy = tt - 15, dx = x - 4;
    for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) digit(g, c.d, dx + ox, dy + oy, 3, '#2a1b3d');
    digit(g, c.d, dx, dy, 3, '#ffec27');
    R(g, '#1d2b53', x, dy - 3, 1, 3);
    if (c.on) {
      const f = Math.floor(s.t * 10 + i) % 2;
      R(g, '#ff004d', x - 2, dy - 9 - f, 5, 6); R(g, '#ffa300', x - 1, dy - 9 - f, 3, 6); R(g, '#ffec27', x, dy - 8 - f, 1, 4);
    }
  });
}

          () => { G.battleDone = true; go('ending'); });

  anim(dt) {

  update() {},
  draw() {
    drawSky(ctx, ['#ffe2ee', '#ffd6e7', '#ffc7de', '#ffbcd8', '#fff1e8', '#fff1e8'], 32);

    for (let y = -7; y <= 7; y++) for (let x = -48; x <= 48; x++) if (x * x / 2304 + y * y / 49 <= 1) { R(ctx, y < 0 ? '#f7b8d2' : '#e898ba', 190 + x, 72 + y, 1, 1); R(ctx, y < 0 ? '#b9e48a' : '#8fd16a', 64 + x, 116 + y, 1, 1); }

  }
};
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }

// =====================================================================
// MAIN LOOP
// =====================================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (Input.pressed.select) toggleMute();
  Fade.update(dt); Trans.update(dt);
  if (Layer.active) Layer.update(dt);
  else if (Menu.active) Menu.update(dt);
  else if (Dialog.active) Dialog.update(dt);
  else if (!Fade.busy && !Trans.active && scene && scene.update) scene.update(dt);
  if (scene && scene.anim) scene.anim(dt);
  updP(dt);
  ctx.fillStyle = '#0e0b16'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shakeT > 0) { shakeT -= dt; ctx.translate(Math.round(rnd(-2, 2)), Math.round(rnd(-2, 2))); }
  if (scene) scene.draw();
  drawP();
  ctx.restore();
  Trans.draw();
  Input.pressed = {}; Pointer.tap = null;
  requestAnimationFrame(loop);
}
// Pilih bentuk konsol (mendatar/berdiri) yang layarnya paling besar, lalu kecilkan sampai pasti muat
function placeOverlays(land) {
  const scr = $('screen'), before = $('flash');
  if (land) { scr.insertBefore($('hud'), before); scr.insertBefore($('dialog'), before); scr.insertBefore($('menu'), before); }
  else { $('hudSlot').appendChild($('hud')); $('panel').appendChild($('dialog')); $('panel').appendChild($('menu')); }
}
function fitLayout(land) {
  const dev = $('device'), kb = $('kb'), vw = innerWidth, vh = innerHeight;
  dev.classList.toggle('land', land); kb.classList.toggle('hide', !land); placeOverlays(land);
  dev.style.zoom = ''; dev.classList.remove('compact');
  const tryFit = () => {
    const floor = land ? 560 : (dev.classList.contains('compact') ? 290 : 350);
    let w = Math.max(floor, Math.min(vw - 16, land ? 960 : 600)), total = 0;
    for (let i = 0; i < 6; i++) {
      dev.style.width = w + 'px';
      total = dev.offsetHeight + (land ? kb.offsetHeight + 8 : 0) + 18;
      if (total <= vh) break;
      const nw = Math.max(floor, Math.floor(w - (total - vh) / 0.75) - 2);
      if (nw >= w) break;
      w = nw;
    }
    return {total, w};
  };
  let r = tryFit();
  if (r.total > vh && !land) { dev.classList.add('compact'); r = tryFit(); }
  let z = 1;
  const tooWide = r.w + 16 > vw;
  if (r.total > vh || tooWide) { z = Math.max(0.45, Math.min((vh - 4) / r.total, tooWide ? (vw - 8) / (r.w + 8) : 1)); dev.style.zoom = z; }
  return $('screen').offsetWidth * z;
}
function fitDevice() {
  const portrait = fitLayout(false);
  if (innerWidth >= 520) { const land = fitLayout(true); if (land <= portrait) fitLayout(false); }
}
addEventListener('resize', fitDevice);
fitDevice();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitDevice);
window.__game = {get G() { return G; }, get scene() { return sceneName; }, get dialog() { return Dialog.active; }, get layer() { return Layer.active; }, get menu() { return Menu.active; }};
$('brand').querySelector('b').textContent = DATA.nama.toUpperCase();
$('brand').querySelector('i').textContent = 'EDISI ' + DATA.umur;
setScene('title');
requestAnimationFrame(loop);
</script>
